# markdownlint-cli2 configuration (run: make lint or npx markdownlint-cli2 "**/*.md")
config:
  default: true
  MD013:
    line_length: 100
    tables: false
    code_blocks: false
    headings: false
  MD033: false   # inline HTML (<br/>) is used inside Mermaid labels
  MD041: false   # first line need not be a heading in per-directory READMEs
ignores:
  - node_modules
  - .venv
